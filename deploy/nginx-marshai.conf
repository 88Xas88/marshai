# Marshai · nginx vhost.
# Установить в /etc/nginx/sites-available/marshai.ru, симлинк в sites-enabled.
# После certbot --nginx -d marshai.ru -d www.marshai.ru добавится TLS-блок.

server {
  server_name marshai.ru www.marshai.ru;

  # Cloudflare real-ip (если включат прокси). Сейчас Cloudflare DNS-only,
  # но оставляем для совместимости с VkusAI.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  real_ip_header CF-Connecting-IP;

  # === GitHub webhook → 127.0.0.1:4568 ===
  location = /webhook/deploy {
    proxy_pass http://127.0.0.1:4568;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Hub-Signature-256 $http_x_hub_signature_256;
    proxy_read_timeout 10s;
  }

  # === Next.js app → 127.0.0.1:3001 ===
  # Статика Next (_next/static, _next/image и т.п.) идёт через тот же proxy_pass,
  # Next отдаёт корректные Cache-Control заголовки сам.
  location / {
    proxy_pass http://127.0.0.1:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_connect_timeout 10s;
    proxy_send_timeout 120s;
    proxy_read_timeout 120s;
  }

  # gzip уже включён в nginx.conf глобально; если нет — раскомментировать:
  # gzip on;
  # gzip_types text/plain text/css application/javascript application/json image/svg+xml;
  # gzip_min_length 1024;

  listen 80;
  listen [::]:80;
}
